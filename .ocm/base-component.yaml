name: ocm.software/open-delivery-gear/observability
resources:
  - name: prometheus-operator
    version: v0.94.1
    type: ociImage
    access:
      type: ociRegistry
      imageReference: quay.io/prometheus-operator/prometheus-operator:v0.94.1
    relation: external
  - name: prometheus
    version: v3.15.0
    type: ociImage
    access:
      type: ociRegistry
      imageReference: docker.io/prom/prometheus:v3.15.0-distroless
    relation: external
  - name: prometheus-config-reloader
    version: v0.94.1
    type: ociImage
    access:
      type: ociRegistry
      imageReference: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    relation: external

  - name: opentelemetry-collector-contrib
    version: 0.163.2
    type: ociImage
    access:
      type: ociRegistry
      imageReference: docker.io/otel/opentelemetry-collector-contrib:0.163.2
    relation: external
  - name: metrics-operator
    version: v1.2.1
    type: ociImage
    access:
      type: ociRegistry
      imageReference: ghcr.io/openmcp-project/images/metrics-operator:v1.2.1
    relation: external
  - name: alertmanager
    version: v0.34.0
    type: ociImage
    access:
      type: ociRegistry
      imageReference: quay.io/prometheus/alertmanager:v0.34.0
    relation: external
  - name: kube-state-metrics
    version: v2.20.0
    type: ociImage
    access:
      type: ociRegistry
      imageReference: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
    relation: external
  - name: perses
    version: v0.54.0
    type: ociImage
    access:
      type: ociRegistry
      imageReference: docker.io/persesdev/perses:v0.54.0
    relation: external
  - name: k8s-sidecar
    version: 2.13.3
    type: ociImage
    access:
      type: ociRegistry
      imageReference: docker.io/kiwigrid/k8s-sidecar:2.13.3
    relation: external
labels:
  - name: odg.ocm.software/responsibles
    value:
      - type: githubTeam
        github_hostname: github.com
        teamname: open-component-model/odg-maintainers
main-source:
  labels:
    - name: odg.ocm.software/source-scan-policy
      value:
        policy: skip
        comment: |
          this repository does not contain source code, but only build descriptions.
