name: ocm.software/open-delivery-gear/observability
resources:
  - name: prometheus-operator
    version: v0.94.1
    type: ociImage
    access:
      type: ociRegistry
      imageReference: quay.io/prometheus-operator/prometheus-operator:v0.94.1
    relation: external
  - name: prometheus
    version: v3.15.0
    type: ociImage
    access:
      type: ociRegistry
      imageReference: docker.io/prom/prometheus:v3.15.0-distroless
    relation: external
  - name: prometheus-config-reloader
    version: v0.94.1
    type: ociImage
    access:
      type: ociRegistry
      imageReference: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
    relation: external
labels:
  - name: odg.ocm.software/responsibles
    value:
      - type: githubTeam
        github_hostname: github.com
        teamname: open-component-model/odg-maintainers
main-source:
  labels:
    - name: odg.ocm.software/source-scan-policy
      value:
        policy: skip
        comment: |
          this repository does not contain source code, but only build descriptions.
