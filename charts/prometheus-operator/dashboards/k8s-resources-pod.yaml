kind: Dashboard
metadata:
  name: k8s-resources-pod
  project: odg
  title: Kubernetes / Compute Resources / Pod
spec:
  display:
    name: Kubernetes / Compute Resources / Pod
  duration: 1h
  variables:
  - kind: ListVariable
    spec:
      name: namespace
      display:
        name: Namespace
      allowAllValue: false
      allowMultiple: false
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          datasource:
            kind: PrometheusDatasource
            name: prometheus
          labelName: namespace
          matchers:
          - container_memory_working_set_bytes{container!=""}
  - kind: ListVariable
    spec:
      name: pod
      display:
        name: Pod
      allowAllValue: false
      allowMultiple: false
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          datasource:
            kind: PrometheusDatasource
            name: prometheus
          labelName: pod
          matchers:
          - container_memory_working_set_bytes{namespace="$namespace",container!=""}
  panels:
    cpu_usage:
      kind: Panel
      spec:
        display:
          name: CPU Usage (millicores)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
                decimalPlaces: 1
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (rate(container_cpu_usage_seconds_total{namespace="$namespace", pod="$pod", container!="",
                  container!="POD"}[$__rate_interval])) * 1000
                seriesNameFormat: '{{container}}'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum(kube_pod_container_resource_requests{namespace="$namespace", pod="$pod", resource="cpu", container!=""})
                  * 1000
                seriesNameFormat: requests
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum(kube_pod_container_resource_limits{namespace="$namespace", pod="$pod", resource="cpu", container!=""})
                  * 1000
                seriesNameFormat: limits
    cpu_throttling:
      kind: Panel
      spec:
        display:
          name: CPU Throttling
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: percent-decimal
            thresholds:
              steps:
              - value: 0.25
                color: '#e02f44'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (increase(container_cpu_cfs_throttled_periods_total{namespace="$namespace", pod="$pod",
                  container!=""}[$__rate_interval])) / sum by (container) (increase(container_cpu_cfs_periods_total{namespace="$namespace",
                  pod="$pod", container!=""}[$__rate_interval]))
                seriesNameFormat: '{{container}}'
    memory_usage:
      kind: Panel
      spec:
        display:
          name: Memory Usage (WSS)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (container_memory_working_set_bytes{namespace="$namespace", pod="$pod", container!="",
                  image!=""})
                seriesNameFormat: '{{container}}'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum(kube_pod_container_resource_requests{namespace="$namespace", pod="$pod", resource="memory", container!=""})
                seriesNameFormat: requests
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum(kube_pod_container_resource_limits{namespace="$namespace", pod="$pod", resource="memory", container!=""})
                seriesNameFormat: limits
    memory_rss:
      kind: Panel
      spec:
        display:
          name: Memory Usage (RSS)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (container_memory_rss{namespace="$namespace", pod="$pod", container!="", container!="POD"})
                seriesNameFormat: '{{container}}'
    memory_pct_requests:
      kind: Panel
      spec:
        display:
          name: Memory Usage % of Request
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: percent-decimal
            thresholds:
              steps:
              - value: 0.8
                color: '#f2aa40'
              - value: 1.0
                color: '#e02f44'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (container_memory_working_set_bytes{namespace="$namespace", pod="$pod", container!="",
                  image!=""}) / sum by (container) (kube_pod_container_resource_requests{namespace="$namespace", pod="$pod",
                  resource="memory", container!=""})
                seriesNameFormat: '{{container}}'
    memory_pct_limits:
      kind: Panel
      spec:
        display:
          name: Memory Usage % of Limit
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: percent-decimal
            thresholds:
              steps:
              - value: 0.8
                color: '#f2aa40'
              - value: 1.0
                color: '#e02f44'
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (container_memory_working_set_bytes{namespace="$namespace", pod="$pod", container!="",
                  image!=""}) / sum by (container) (kube_pod_container_resource_limits{namespace="$namespace", pod="$pod",
                  resource="memory", container!=""})
                seriesNameFormat: '{{container}}'
    net_receive:
      kind: Panel
      spec:
        display:
          name: Receive Bandwidth
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_receive_bytes_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    net_transmit:
      kind: Panel
      spec:
        display:
          name: Transmit Bandwidth
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_transmit_bytes_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    net_receive_packets:
      kind: Panel
      spec:
        display:
          name: Rate of Received Packets
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_receive_packets_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    net_transmit_packets:
      kind: Panel
      spec:
        display:
          name: Rate of Transmitted Packets
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_transmit_packets_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    net_receive_dropped:
      kind: Panel
      spec:
        display:
          name: Rate of Received Packets Dropped
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_receive_packets_dropped_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    net_transmit_dropped:
      kind: Panel
      spec:
        display:
          name: Rate of Transmitted Packets Dropped
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_network_transmit_packets_dropped_total{namespace="$namespace", pod="$pod"}[$__rate_interval]))
                seriesNameFormat: '{{pod}}'
    iops_pod:
      kind: Panel
      spec:
        display:
          name: IOPS (Pod)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: ceil(sum by (pod) (rate(container_fs_reads_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval])))
                seriesNameFormat: reads
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: ceil(sum by (pod) (rate(container_fs_writes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval])))
                seriesNameFormat: writes
    throughput_pod:
      kind: Panel
      spec:
        display:
          name: Throughput (Pod)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_fs_reads_bytes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval]))
                seriesNameFormat: reads
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (pod) (rate(container_fs_writes_bytes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval]))
                seriesNameFormat: writes
    iops_containers:
      kind: Panel
      spec:
        display:
          name: IOPS (Containers)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: ceil(sum by (container) (rate(container_fs_reads_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval])
                  + rate(container_fs_writes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval])))
                seriesNameFormat: '{{container}}'
    throughput_containers:
      kind: Panel
      spec:
        display:
          name: Throughput (Containers)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (container) (rate(container_fs_reads_bytes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval])
                  + rate(container_fs_writes_bytes_total{namespace="$namespace", pod="$pod", container!=""}[$__rate_interval]))
                seriesNameFormat: '{{container}}'
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 24
        height: 7
        content:
          $ref: '#/spec/panels/cpu_usage'
      - x: 0
        y: 7
        width: 24
        height: 7
        content:
          $ref: '#/spec/panels/cpu_throttling'
      - x: 0
        y: 14
        width: 24
        height: 7
        content:
          $ref: '#/spec/panels/memory_usage'
      - x: 0
        y: 21
        width: 24
        height: 7
        content:
          $ref: '#/spec/panels/memory_rss'
      - x: 0
        y: 28
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/memory_pct_requests'
      - x: 12
        y: 28
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/memory_pct_limits'
      - x: 0
        y: 35
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_receive'
      - x: 12
        y: 35
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_transmit'
      - x: 0
        y: 42
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_receive_packets'
      - x: 12
        y: 42
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_transmit_packets'
      - x: 0
        y: 49
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_receive_dropped'
      - x: 12
        y: 49
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/net_transmit_dropped'
      - x: 0
        y: 56
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/iops_pod'
      - x: 12
        y: 56
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/throughput_pod'
      - x: 0
        y: 63
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/iops_containers'
      - x: 12
        y: 63
        width: 12
        height: 7
        content:
          $ref: '#/spec/panels/throughput_containers'
