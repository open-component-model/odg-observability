      items:
      - x: 0
        y: 0
        width: 24
        height: 10
        content:
          $ref: '#/spec/panels/cpu_usage'
      - x: 0
        y: 10
        width: 24
        height: 10
        content:
          $ref: '#/spec/panels/memory_usage'
      - x: 0
        y: 20
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_receive'
      - x: 12
        y: 20
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_transmit'
      - x: 0
        y: 30
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_receive_avg'
      - x: 12
        y: 30
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_transmit_avg'
      - x: 0
        y: 40
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_receive_packets'
      - x: 12
        y: 40
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_transmit_packets'
      - x: 0
        y: 50
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_receive_dropped'
      - x: 12
        y: 50
        width: 12
        height: 10
        content:
          $ref: '#/spec/panels/net_transmit_dropped'
