kind: Dashboard
metadata:
  name: k8s-resources-workload
  project: odg
  title: Kubernetes / Compute Resources / Workload
spec:
  display:
    name: Kubernetes / Compute Resources / Workload
  duration: 1h
  variables:
  - kind: ListVariable
    spec:
      name: namespace
      display:
        name: Namespace
      allowAllValue: false
      allowMultiple: false
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          datasource:
            kind: PrometheusDatasource
            name: prometheus
          labelName: namespace
          matchers:
          - container_memory_working_set_bytes{container!=""}
  - kind: ListVariable
    spec:
      name: workload_type
      display:
        name: Workload Type
      allowAllValue: false
      allowMultiple: false
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          datasource:
            kind: PrometheusDatasource
            name: prometheus
          labelName: owner_kind
          matchers:
          - kube_replicaset_owner{namespace="$namespace"}
          - kube_pod_owner{namespace="$namespace",owner_kind!="ReplicaSet",owner_is_controller="true"}
  - kind: ListVariable
    spec:
      name: workload
      display:
        name: Workload
      allowAllValue: false
      allowMultiple: false
      plugin:
        kind: PrometheusLabelValuesVariable
        spec:
          datasource:
            kind: PrometheusDatasource
            name: prometheus
          labelName: owner_name
          matchers:
          - kube_replicaset_owner{namespace="$namespace",owner_kind="$workload_type"}
          - kube_pod_owner{namespace="$namespace",owner_kind="$workload_type"}
  panels:
    cpu_usage:
      kind: Panel
      spec:
        display:
          name: CPU Usage (millicores)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
                decimalPlaces: 1
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\"\
                  , container!=\"POD\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n\
                  \      kube_replicaset_owner{namespace=\"$namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"\
                  },\n      \"owner_name\", \"$1\", \"replicaset\", \"(.*)\"\n    )\n  )\n) * 1000\nor\nsum by (pod) (\n \
                  \ rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\", container!=\"POD\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\", owner_kind=\"$workload_type\"\
                  , owner_name=\"$workload\"}\n) * 1000"
                seriesNameFormat: '{{pod}}'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum(\n  kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"cpu\", container!=\"\
                  \"}\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"\
                  ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n) * 1000\nor\nsum(\n  kube_pod_container_resource_requests{namespace=\"\
                  $namespace\", resource=\"cpu\", container!=\"\"}\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n) * 1000"
                seriesNameFormat: requests
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum(\n  kube_pod_container_resource_limits{namespace=\"$namespace\", resource=\"cpu\", container!=\"\
                  \"}\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"\
                  ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n) * 1000\nor\nsum(\n  kube_pod_container_resource_limits{namespace=\"\
                  $namespace\", resource=\"cpu\", container!=\"\"}\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n) * 1000"
                seriesNameFormat: limits
    memory_usage:
      kind: Panel
      spec:
        display:
          name: Memory Usage (WSS)
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\", image!=\"\
                  \"}\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"\
                  ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  container_memory_working_set_bytes{namespace=\"\
                  $namespace\", container!=\"\", image!=\"\"}\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum(\n  kube_pod_container_resource_requests{namespace=\"$namespace\", resource=\"memory\", container!=\"\
                  \"}\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"\
                  ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum(\n  kube_pod_container_resource_requests{namespace=\"$namespace\"\
                  , resource=\"memory\", container!=\"\"}\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: requests
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum(\n  kube_pod_container_resource_limits{namespace=\"$namespace\", resource=\"memory\", container!=\"\
                  \"}\n  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"\
                  ReplicaSet\"}\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum(\n  kube_pod_container_resource_limits{namespace=\"$namespace\"\
                  , resource=\"memory\", container!=\"\"}\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: limits
    net_receive:
      kind: Panel
      spec:
        display:
          name: Receive Bandwidth
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  rate(container_network_receive_bytes_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_transmit:
      kind: Panel
      spec:
        display:
          name: Transmit Bandwidth
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  rate(container_network_transmit_bytes_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_receive_avg:
      kind: Panel
      spec:
        display:
          name: 'Average Container Bandwidth: Received'
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "avg by (pod) (\n  rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\navg by (pod) (\n  rate(container_network_receive_bytes_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_transmit_avg:
      kind: Panel
      spec:
        display:
          name: 'Average Container Bandwidth: Transmitted'
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: bytes/sec
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "avg by (pod) (\n  rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\navg by (pod) (\n  rate(container_network_transmit_bytes_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_receive_packets:
      kind: Panel
      spec:
        display:
          name: Rate of Received Packets
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_receive_packets_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  rate(container_network_receive_packets_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_transmit_packets:
      kind: Panel
      spec:
        display:
          name: Rate of Transmitted Packets
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_transmit_packets_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  rate(container_network_transmit_packets_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_receive_dropped:
      kind: Panel
      spec:
        display:
          name: Rate of Received Packets Dropped
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_receive_packets_dropped_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
                  replicaset\", \"(.*)\"\n    )\n  )\n)\nor\nsum by (pod) (\n  rate(container_network_receive_packets_dropped_total{namespace=\"\
                  $namespace\"}[$__rate_interval])\n  * on(namespace, pod) group_left()\n  kube_pod_owner{namespace=\"$namespace\"\
                  , owner_kind=\"$workload_type\", owner_name=\"$workload\"}\n)"
                seriesNameFormat: '{{pod}}'
    net_transmit_dropped:
      kind: Panel
      spec:
        display:
          name: Rate of Transmitted Packets Dropped
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values:
              - last
              - max
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: "sum by (pod) (\n  rate(container_network_transmit_packets_dropped_total{namespace=\"$namespace\"}[$__rate_interval])\n\
                  \  * on(namespace, pod) group_left()\n  (\n    kube_pod_owner{namespace=\"$namespace\", owner_kind=\"ReplicaSet\"\
                  }\n    * on(namespace, owner_name) group_left()\n    label_replace(\n      kube_replicaset_owner{namespace=\"\
                  $namespace\", owner_kind=\"$workload_type\", owner_name=\"$workload\"},\n      \"owner_name\", \"$1\", \"\
