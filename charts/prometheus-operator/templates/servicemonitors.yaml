apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  selector:
    matchLabels:
      app: delivery-service
  endpoints:
    - port: default
      interval: {{ default "15s" .Values.scrapeInterval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - interval: 15s
      port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-state-metrics
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  selector:
    matchLabels:
      monitoring: prometheus
  endpoints:
    - port: http
      interval: {{ default "15s" .Values.scrapeInterval }}
      honorLabels: true
      metricRelabelings:
        # drop high-cardinality labels we don't need
        - sourceLabels: [__name__]
          regex: kube_pod_(container_info|init_container_info)
          action: drop
---
# self-scrape: select the prometheus-operated service created by the operator for the
# Prometheus CR; label operated-prometheus=true is set by the operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-self
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  selector:
    matchLabels:
      operated-prometheus: "true"
  endpoints:
    - port: web
      interval: {{ default "15s" .Values.scrapeInterval }}
{{- if .Values.perses.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: perses
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  selector:
    matchLabels:
      monitoring: perses
  endpoints:
    - port: http
      interval: {{ default "15s" .Values.scrapeInterval }}
{{- end }}
