apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-pod-alerts
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  labels:
    app: prometheus
spec:
  groups:
    - name: odg-backlog
      rules:
        - alert: OdgBacklogItemStale
          # time() - creationTimestamp over 24h: any unclaimed BLI stuck for a full day
          # means a service is starved (no worker, no capacity, or permanently failing).
          expr: (time() - odg_backlogitem_oldest_unclaimed_seconds) / 3600 > 24
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: BacklogItem unclaimed for >24h on {{ "{{" }} $labels.exported_service {{ "}}" }}.
            description: 'The oldest unclaimed BacklogItem for service {{ "{{" }} $labels.exported_service {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has been waiting for {{ "{{" }} $value | printf "%.1f" {{ "}}" }} hours.'
    - name: kubernetes-apps
      rules:
        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod is crash looping.
            description: 'Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.container {{ "}}" }}) is in waiting state (reason: "CrashLoopBackOff").'

        - alert: KubePodNotReady
          expr: |-
            sum by (namespace, pod) (
              max by (namespace, pod) (
                kube_pod_status_phase{phase=~"Pending|Unknown"}
                or
                (
                  kube_pod_status_phase{phase="Running"} == 1
                  and on (namespace, pod)
                  kube_pod_status_ready{condition="true"} == 0
                )
              ) * on (namespace, pod) group_left() topk by (namespace, pod) (
                1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"})
              )
            ) > 0
            unless on (namespace, pod)
            kube_pod_status_reason{reason="SchedulingGated"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod has been in a non-ready state for more than 15 minutes.
            description: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has been in a non-ready state for longer than 15 minutes.

        - alert: KubeDeploymentRolloutStuck
          expr: |-
            kube_deployment_status_condition{condition="Progressing", status="false"}
            != 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment rollout is not progressing.
            description: Rollout of deployment {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }} is not progressing for longer than 15 minutes.

        - alert: KubeContainerWaiting
          expr: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Pod container waiting longer than 1 hour.
            description: 'pod/{{ "{{" }} $labels.pod {{ "}}" }} in namespace {{ "{{" }} $labels.namespace {{ "}}" }} on container {{ "{{" }} $labels.container {{ "}}" }} has been in waiting state for longer than 1 hour. (reason: "{{ "{{" }} $labels.reason {{ "}}" }}")'
