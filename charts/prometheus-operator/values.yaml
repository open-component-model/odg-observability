host: ~

# image property will be set during release
image:
  repository: ~
  tag: ~

prometheus:
  image:
    repository: ~
    tag: ~

prometheus-config-reloader:
  image:
    repository: ~
    tag: ~

scrapeInterval: 15s

alertmanager:
  enabled: false
  image:
    repository: ~
    tag: ~
  slack:
    enabled: false
    apiURL: https://slack.com/api/chat.postMessage
    channel: ~
    token: ~
    title: |-
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    text: |-
      {{ range .Alerts }}*Alert:* {{ .Annotations.summary }}{{ if .Annotations.description }}
      *Description:* {{ .Annotations.description }}{{ end }}
      *Severity:* {{ .Labels.severity }}
      *Namespace:* {{ .Labels.namespace }}
      {{ end }}


# kube-state-metrics subchart configuration (see
# https://artifacthub.io/packages/helm/prometheus-community/kube-state-metrics)
kube-state-metrics:
  image:
    # When repository is set (by OCM relocation), the kube-state-metrics.image helper override
    # in templates/helpers.tpl treats it as a flat "host/path/image" reference (same pattern
    # as the other images in this chart). Empty string means "not set" — the helper then falls
    # back to KSM's native registry+repository assembly so upstream defaults still work.
    repository: ""
    tag: ~
    # Explicit default so the fallback registry/repository assembly still works when
    # repository is unset. Must match the KSM subchart's own default.
    registry: registry.k8s.io
  # labels on the Service so our own ServiceMonitor (templates/servicemonitors.yaml)
  # can select it
  customLabels:
    monitoring: prometheus
  prometheus:
    monitor:
      # we create our own ServiceMonitor (see this chart's templates/)
      enabled: false
  # watch only the namespace this chart is deployed into; set to false to watch all namespaces
  releaseNamespace: true
  # keep namespace-scoped collectors minimal; drop cluster-wide resources not needed for pod health
  collectors:
    - pods
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
    - jobs
    - cronjobs
