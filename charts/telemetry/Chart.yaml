apiVersion: v2
name: telemetry
description: ODG telemetry umbrella — OTel collector daemonset (filelog/k8sattributes/hostmetrics), metrics-operator, DataSink + Metric CRs. Backends via one switch.
type: application
version: 0.1.0
dependencies:
  - name: opentelemetry-collector
    version: 0.177.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  # Second, aliased instance of the same sub-chart: a single-replica Deployment
  # that runs ONLY the k8s_cluster receiver. Cluster-scope state is identical
  # from every node, so a DaemonSet would emit N-1 duplicate series. Enabled
  # only when otelMetrics.enabled=true.
  - name: opentelemetry-collector
    version: 0.177.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: opentelemetry-collector-cluster
    condition: otelMetrics.enabled
  - name: metrics-operator
    version: v1.2.1
    repository: oci://ghcr.io/openmcp-project/charts
    condition: metrics-operator.enabled
