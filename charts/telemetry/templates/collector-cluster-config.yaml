{{- if .Values.otelMetrics.enabled }}
# Config for the single-replica k8s_cluster Deployment (opentelemetry-collector-cluster).
# Cluster-scope state (deployments, pods-as-objects, nodes, quotas) is identical from
# every node, so running the receiver in the DaemonSet would emit N-1 duplicate series.
# Disable with otelMetrics.enabled=false — this ConfigMap and the deployment disappear
# together, kube-state-metrics + cadvisor keep winning.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-cluster-override
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
data:
  relay: |
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      # K8s object state from the API server — replaces kube-state-metrics.
      # Runs ONCE cluster-wide via the deployment, not per-node.
      k8s_cluster:
        collection_interval: {{ .Values.otelMetrics.collectionInterval | quote }}
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable]
        metrics:
          # Default metrics already cover the perses panels (k8s.deployment.desired,
          # .available, k8s.container.*, k8s.pod.phase, k8s.namespace.phase,
          # k8s.resource_quota.*). Enable a few more for parity with ksm dashboards.
          k8s.node.condition: { enabled: true }
          k8s.container.ready: { enabled: true }
          k8s.container.restarts: { enabled: true }
          k8s.statefulset.ready_pods: { enabled: true }
          k8s.daemonset.ready_nodes: { enabled: true }

    processors:
      # cluster identity so receiver output picks up k8s.cluster.name the same way as
      # the daemonset pipeline — label for cross-landscape aggregation. Same transform
      # statements as in collector-config.yaml, applied to the metrics signal.
      transform/cluster_identity:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              {{- include "telemetry.clusterIdentityStatements" . | nindent 14 }}
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      # scraped by Prometheus; resource attrs (k8s.cluster.name, ...) become labels
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true
      {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
      debug:
        verbosity: {{ .Values.debugVerbosity }}
      {{- end }}

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: none        # no self-scraping — Prometheus already gets k8s_cluster's data
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, transform/cluster_identity, batch]
          exporters:
            - prometheus
            {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
            - debug
            {{- end }}
{{- end }}
