{{- if .Values.metrics.enabled }}
# BacklogItem (BLI) metrics. BacklogItem CRs are namespaced to .Values.observedNamespace
# in the ODG platform. Deletion happens on success — series disappear once processed,
# which downstream alerting treats as "drained" rather than "missing".
# Used groupings:
#   sum by (service, claimed)(odg_backlogitems)       — per-service backlog depth, claimed vs unclaimed
#   sum by (service, priority)(odg_backlogitems)      — per-service mix of priorities in flight
#   odg_backlogitem_oldest_unclaimed_seconds          — age of oldest BLI still waiting; alert
#                                                       on (time() - metric) > SLA
---
apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: odg-backlogitems
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  name: odg_backlogitems
  description: "BacklogItems by service and claimed label. 'claimed' says whether a worker picked the item up. Aggregate: sum by (service, claimed)(odg_backlogitems)"
  interval: {{ .Values.metrics.interval | quote }}
  target:
    group: delivery-gear.gardener.cloud
    version: v1
    kind: BacklogItem
  dataSinkRef:
    name: default
  projections:
    - name: service
      fieldPath: 'metadata.labels.delivery-gear\.gardener\.cloud/service'
    - name: claimed
      fieldPath: 'metadata.labels.delivery-gear\.gardener\.cloud/claimed'
      default: "False"   # freshly-created BLIs have no claimed label at all
---
apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: odg-backlogitems-priority
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  name: odg_backlogitems_priority
  description: "BacklogItems by service and numeric priority (0=NONE, 1=LOW, 2=MEDIUM, 4=HIGH, 8=CRITICAL). Watch for high-priority backlog buildup."
  interval: {{ .Values.metrics.interval | quote }}
  target:
    group: delivery-gear.gardener.cloud
    version: v1
    kind: BacklogItem
  dataSinkRef:
    name: default
  projections:
    - name: service
      fieldPath: 'metadata.labels.delivery-gear\.gardener\.cloud/service'
    - name: priority
      fieldPath: 'spec.priority'
---
apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: odg-backlogitem-oldest-unclaimed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  name: odg_backlogitem_oldest_unclaimed_seconds
  description: "Creation timestamp (Unix seconds) of the oldest unclaimed BacklogItem per service. Alert on (time() - metric) > SLA. Emits 0 when nothing is unclaimed."
  interval: {{ .Values.metrics.interval | quote }}
  target:
    group: delivery-gear.gardener.cloud
    version: v1
    kind: BacklogItem
  dataSinkRef:
    name: default
  # No fieldSelector for 'claimed' — k8s field selectors only support
  # metadata.name/namespace, not labels. min-over-all approximates oldest-
  # unclaimed well enough; claimed items are typically newer.
  valueFrom:
    fieldPath: metadata.creationTimestamp
    type: timestamp
    aggregation: min
    default: '"1970-01-01T00:00:00Z"'
  projections:
    - name: service
      fieldPath: 'metadata.labels.delivery-gear\.gardener\.cloud/service'
{{- end }}
