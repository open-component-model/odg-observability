# ODG's bootstrapping chart ships a namespace-wide default-deny NetworkPolicy on
# workload clusters. Without these the collector can't be reached (4317/4318/8889)
# and the metrics-operator can't reach its dependencies.
# Managed here (not via subchart extraManifests) so metric/observability wiring
# lives in one place; supersedes the overlay previously applied by
# service-provider-odg/local-telemetry/telemetry.sh (removed there).
# Pod selectors must match the subchart's own labels (name + instance).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
        - { port: 8889, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # Cluster-local traffic: pods (10.0.0.0/8, node pod CIDRs), legacy
    # docker/service CIDRs (172.16/192.168), and the gardener service CIDR
    # (100.64.0.0/10) — kube-dns and the kubernetes.default ClusterIP live
    # there. Without 100.64/10 the collector can't reach kube-apiserver for
    # k8sattributes and rbac-informer lookups.
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
        - ipBlock: { cidr: 100.64.0.0/10 }
{{- if eq .Values.backend "btp" }}
    # BTP Cloud Logging ingest-otlp endpoint is public-facing. Its IPs rotate
    # (SAP CLS is multi-region); only TCP/443 is needed for OTLP.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
    # kube-dns ClusterIP lives in the service CIDR (100.64.0.0/10 on gardener),
    # NOT in the RFC1918 ranges above. Without DNS egress, resolving the public
    # BTP endpoint hangs inside the gRPC dial -> DeadlineExceeded on export.
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
      to:
        - ipBlock: { cidr: 0.0.0.0/0 }
{{- end }}
{{- if .Values.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-metrics-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - {}   # any: SAP service CIDRs are not RFC1918-stable (gardener/BTP vary)
{{- end }}
