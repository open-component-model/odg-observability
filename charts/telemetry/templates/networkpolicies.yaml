# ODG's bootstrapping chart ships a namespace-wide default-deny NetworkPolicy on
# workload clusters. Without these the collector can't be reached (4317/4318/8889)
# and the metrics-operator can't reach its dependencies.
# Managed here (not via subchart extraManifests) so metric/observability wiring
# lives in one place; supersedes the overlay previously applied by
# service-provider-odg/local-telemetry/telemetry.sh (removed there).
# Pod selectors must match the subchart's own labels (name + instance).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
        - { port: 8889, protocol: TCP }
        # kubelet liveness/readiness probes hit the health_check extension
        # from the node IP — blocked by this ingress-only policy otherwise.
        - { port: 13133, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # No CIDR-scoped rules at all: clusters can run on arbitrary pod/service
    # IP ranges, so every egress need is covered by a port-scoped rule below.
    # DNS: kube-dns ClusterIP sits in the service CIDR, which varies by
    # landscape; port 53 to anywhere keeps resolution working regardless.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # kube-apiserver (k8sattributes processor): gardener injects
    # KUBERNETES_SERVICE_HOST=api.<shoot>.<project>.internal... into every pod,
    # which may resolve to a non-private LB IP. Allow :443 explicitly.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
{{- if eq .Values.backend "opensearch" }}
    # opensearch backend: endpoint is typically a svc DNS name
    # (opensearch-*.svc.cluster.local:9200) whose ClusterIP sits in a
    # landscape-specific service CIDR. The port-scoped rule works on any
    # cluster IP layout; non-default ports need values.opensearch.port.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: {{ .Values.opensearch.port | default 9200 }}, protocol: TCP }
{{- end }}
    # btp backend is public-facing (:443, covered by the rule above); its IPs
    # rotate (SAP CLS is multi-region) so ipBlocks couldn't pin it anyway.
    # debug backend has no push exporter — nothing to allow. Any future
    # backend with a non-53/443 port needs an explicit port rule here.
{{- if .Values.otelMetrics.enabled }}
    # kubeletstats receiver scrapes the kubelet on TCP/10250 on every node;
    # node IPs vary by landscape (RFC1918 on kind/gardener, anything on-prem).
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 10250, protocol: TCP }
{{- end }}
{{- if .Values.otelMetrics.enabled }}
---
# The single-replica k8s_cluster collector: only needs egress to kube-apiserver
# (the receiver's whole purpose) + ingress from Prometheus scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-otel-collector-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector-cluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8889, protocol: TCP }
        # kubelet liveness/readiness probes hit the health_check extension
        # from the node IP — blocked by this ingress-only policy otherwise.
        - { port: 13133, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-otel-collector-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector-cluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # Cluster-internal only: kube-apiserver + kube-dns. Both are reached via
    # port-scoped rules below, so no cluster CIDR assumptions are needed at all
    # (clusters can run on arbitrary pod/service IP ranges).
    # DNS: kube-dns ClusterIP sits in the service CIDR, which varies by
    # landscape; port 53 to anywhere keeps resolution working regardless.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # kube-apiserver is the k8s_cluster receiver's only target. Gardener
    # injects KUBERNETES_SERVICE_HOST=api.<shoot>.<project>.internal... into
    # every pod, so the apiserver is reached via that DNS name on 443, which
    # may resolve to a non-private LB IP. Allow :443 explicitly.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
{{- end }}
{{- if .Values.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-metrics-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - {}   # any: SAP service CIDRs are not RFC1918-stable (gardener/BTP vary)
{{- end }}
