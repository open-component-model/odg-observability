# ODG's bootstrapping chart ships a namespace-wide default-deny NetworkPolicy on
# workload clusters. Without these the collector can't be reached (4317/4318/8889)
# and the metrics-operator can't reach its dependencies.
# Managed here (not via subchart extraManifests) so metric/observability wiring
# lives in one place; supersedes the overlay previously applied by
# service-provider-odg/local-telemetry/telemetry.sh (removed there).
# Pod selectors must match the subchart's own labels (name + instance).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
        - { port: 8889, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # Cluster-local traffic: pods (10.0.0.0/8, node pod CIDRs), legacy
    # docker/service CIDRs (172.16/192.168), and the gardener service CIDR
    # (100.64.0.0/10) — kube-dns and the kubernetes.default ClusterIP live
    # there. Without 100.64/10 the collector can't reach kube-apiserver for
    # k8sattributes and rbac-informer lookups.
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
        - ipBlock: { cidr: 100.64.0.0/10 }
    # kube-dns ClusterIP lives in the service CIDR (100.64.0.0/10 on gardener),
    # and rule #1 above already covers it. Keep this explicit DNS rule anyway:
    # any backend that pushes outside the cluster (btp, opensearch, ...) needs
    # DNS resolution to succeed, and future backends may sit outside the
    # private ranges.
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
      to:
        - ipBlock: { cidr: 0.0.0.0/0 }
{{- if eq .Values.backend "btp" }}
    # BTP Cloud Logging ingest-otlp endpoint is public-facing. Its IPs rotate
    # (SAP CLS is multi-region); only TCP/443 is needed for OTLP.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
{{- end }}
    # opensearch backend is cluster-only by design: endpoint is a svc DNS name
    # (opensearch-*.svc.cluster.local:9200). Rule #1 above covers pod + service
    # CIDRs, so no extra rule here. Point the chart at an external OpenSearch
    # and you must add an explicit ipBlock+port rule yourself.
{{- if .Values.otelMetrics.enabled }}
    # kubeletstats receiver scrapes the kubelet on TCP/10250 on every node.
    # Existing rule #1 covers RFC1918 node IPs (kind, most gardener CIDRs);
    # this explicit rule keeps kubelet reachable on networks where node IPs
    # fall outside those ranges (rare, but real on some on-prem landscapes).
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 10250, protocol: TCP }
{{- end }}
{{- if .Values.otelMetrics.enabled }}
---
# The single-replica k8s_cluster collector: only needs egress to kube-apiserver
# (the receiver's whole purpose) + ingress from Prometheus scraper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-otel-collector-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector-cluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8889, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-otel-collector-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector-cluster
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    # Cluster-internal only: kube-apiserver + kube-dns. Both sit in cluster
    # private/100.64 ranges; no public egress ever required.
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
        - ipBlock: { cidr: 100.64.0.0/10 }
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
      to:
        - ipBlock: { cidr: 0.0.0.0/0 }
{{- end }}
{{- if .Values.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-metrics-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - {}   # any: SAP service CIDRs are not RFC1918-stable (gardener/BTP vary)
{{- end }}
