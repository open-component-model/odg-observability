# NOTE: config changes to this ConfigMap do NOT auto-roll the DaemonSet.
# values.yaml's opentelemetry-collector.podAnnotations carries a hash computed
# from the same .Values that drive this template — keep its list in sync when
# this template starts consuming additional values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-override
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opentelemetry-collector.labels" . | nindent 4 }}
data:
  relay: |
    {{- if .Values.configOverride }}
    # Full override — user owns the whole collector config (see values.configOverride).
    {{ .Values.configOverride | nindent 4 }}
    {{- else }}
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      filelog:
        # keep self-observation quiet: don't ship the collector's own logs
        exclude:
          - /var/log/pods/{{ .Values.observedNamespace }}_{{ include "telemetry.collectorDaemonSetPrefix" . }}*/*/*.log
          {{- range .Values.excludePodPrefixes }}
          - /var/log/pods/{{ $.Values.observedNamespace }}_{{ . }}*/*/*.log
          {{- end }}
        include:
          - /var/log/pods/{{ .Values.observedNamespace }}_*/*/*.log
        start_at: end
        include_file_path: true   # container-parser's add_metadata_from_filepath needs this
        operators:
          - id: container-parser
            type: container
            add_metadata_from_filepath: true
          # structlog-style JSON bodies become searchable attributes; plain text passes through
          - id: json-parser
            type: json_parser
            if: 'body matches "^{"'
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization: { enabled: true }
          memory:
            metrics:
              system.memory.utilization: { enabled: true }
      {{- if .Values.otelMetrics.enabled }}
      # Pod/container CPU+memory from the same node's kubelet (replaces cadvisor scrape).
      # ServiceAccount + nodes/stats RBAC (values.yaml clusterRole.rules) authorises the
      # request; node name comes from the downward API via the subchart's default env vars.
      kubeletstats:
        collection_interval: {{ .Values.otelMetrics.collectionInterval | quote }}
        auth_type: serviceAccount
        endpoint: "${env:OTEL_K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        extra_metadata_labels: [k8s.volume.type]
        metrics:
          k8s.pod.cpu_limit_utilization: { enabled: true }
          k8s.pod.cpu_request_utilization: { enabled: true }
          k8s.pod.memory_limit_utilization: { enabled: true }
          k8s.pod.memory_request_utilization: { enabled: true }
      # NOTE: k8s_cluster receiver moved to opentelemetry-collector-cluster
      # (single-replica Deployment) — cluster state is identical on every node.
      {{- end }}

    processors:
      k8sattributes:
        auth_type: serviceAccount
        filter:
          namespace: {{ .Values.observedNamespace | quote }}
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.container.name
          labels:
            # set by the mODG operator (ManagedResource injectLabels): name of the ODG
            # CR, e.g. "odg-dev". Absent on service-provider-odg installs.
            - tag_name: odg.instance
              key: open-delivery-gear.ocm.software/odg-name
              from: pod
            # service-provider-odg: flux commonMetadata labels only top-level objects,
            # not pods -> read the same key from the owner. Pod label wins if both exist.
            - tag_name: odg.instance.owner
              key: open-delivery-gear.ocm.software/odg-name
              from: deployment
            - tag_name: odg.instance.owner
              key: open-delivery-gear.ocm.software/odg-name
              from: statefulset
            - tag_name: cloud.region
              key: topology.kubernetes.io/region
              from: pod
          {{- if .Values.annotationKey }}
          annotations:
            - key: {{ .Values.annotationKey | quote }}
              from: pod
          {{- end }}
      {{- if .Values.annotationKey }}
      # annotation gate — pods without {{ .Values.annotationKey }}: "true" are dropped
      filter/only_annotated:
        error_mode: ignore
        logs:
          log_record:
            - 'resource.attributes["k8s.pod.annotation.{{ .Values.annotationKey }}"] != "true"'
      {{- end }}
      # always-on exclusions: known noisy apps we never want to ship. Matches pod-name
      # prefix instead of k8s.deployment.name — that attr is only populated for
      # Deployment-owned pods (delivery-db is a StatefulSet and would slip through).
      filter/exclude_noisy:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^delivery-dashboard-")'
            # [0-9]+$ keeps 'delivery-db-backup-…' CronJob pods alive
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^delivery-db-[0-9]+$")'
            # telemetry stack chatter — infra, not workload logs. Prefixes match the
            # fullnameOverride pins in values.yaml; the collector itself is additionally
            # excluded at the filelog path level (never even read from disk).
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^prometheus-operator-")'
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^kube-state-metrics-")'
            # perses-app fullnameOverride: perses (statefulset -> perses-0, perses-1, ...)
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^perses-[0-9]+$")'
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^{{ (index .Values "metrics-operator" "fullnameOverride") }}-")'
            - 'IsMatch(resource.attributes["k8s.pod.name"], "^{{ (index .Values "opentelemetry-collector" "fullnameOverride") }}-")'
      # Cluster identity without per-landscape config. Gardener sets
      # KUBERNETES_SERVICE_HOST to the shoot API domain in every pod:
      #   api.<shoot>.<project>.internal.live.k8s.ondemand.com
      # -> k8s.cluster.name = "<project>/<shoot>" (e.g. garden-ci/modg-user-0).
      # Non-Gardener clusters keep the raw value (IP/host) — still unique per cluster.
      transform/cluster_identity:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              {{- include "telemetry.clusterIdentityStatements" . | nindent 14 }}
        trace_statements:
          - context: resource
            statements:
              {{- include "telemetry.clusterIdentityStatements" . | nindent 14 }}
        metric_statements:
          - context: resource
            statements:
              {{- include "telemetry.clusterIdentityStatements" . | nindent 14 }}
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

    exporters:
      # scraped by a Prometheus; resource attrs (k8s.pod.name, ...) become metric labels
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true
      {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
      # debug exporter only when backend=debug: when pushing to btp/opensearch,
      # those exporters are the destination, debug output is noise.
      debug:
        verbosity: {{ .Values.debugVerbosity }}
      {{- end }}
      {{- if eq .Values.backend "opensearch" }}
      opensearch/logs:
        http:
          endpoint: {{ required "opensearch.endpoint is required when backend=opensearch" .Values.opensearch.endpoint | quote }}
        logs_index: {{ .Values.opensearch.logsIndex | quote }}
      opensearch/traces:
        http:
          endpoint: {{ .Values.opensearch.endpoint | quote }}
        traces_index: {{ .Values.opensearch.tracesIndex | quote }}
      {{- end }}
      {{- if eq .Values.backend "btp" }}
      # BTP Cloud Logging: OTLP gRPC with mTLS; certs mounted from values.btp.certsSecret
      otlp/btp:
        endpoint: {{ required "btp.endpoint is required when backend=btp" .Values.btp.endpoint | quote }}
        tls:
          ca_file: /etc/ssl/certs/btp/ca.crt
          cert_file: /etc/ssl/certs/btp/tls.crt
          key_file: /etc/ssl/certs/btp/tls.key
        # BTP DNS returns multiple IPs; round_robin cycles past a stale one on reconnect.
        balancer_name: round_robin
      {{- end }}

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: basic
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            - memory_limiter
            - k8sattributes
            {{- if .Values.annotationKey }}
            - filter/only_annotated
            {{- end }}
            - filter/exclude_noisy
            - transform/cluster_identity
            - batch
          exporters:
            {{- if eq .Values.backend "opensearch" }}
            - opensearch/logs
            {{- else if eq .Values.backend "btp" }}
            - otlp/btp
            {{- end }}
            {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
            - debug
            {{- end }}

        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/cluster_identity, batch]
          exporters:
            {{- if eq .Values.backend "opensearch" }}
            - opensearch/traces
            {{- else if eq .Values.backend "btp" }}
            - otlp/btp
            {{- end }}
            {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
            - debug
            {{- end }}

        metrics:
          receivers: [otlp, hostmetrics{{- if .Values.otelMetrics.enabled }}, kubeletstats{{- end }}]
          # cluster identity on metrics too: deployment.environment.name + k8s.cluster.name
          # become Prometheus labels via resource_to_telemetry_conversion.
          processors: [memory_limiter, transform/cluster_identity, batch]
          # metrics always go to the in-cluster Prometheus exporter; never pushed
          # to BTP/OpenSearch (their logs/traces indices are not the right shape).
          exporters:
            - prometheus
            {{- if and .Values.debugVerbosity (eq .Values.backend "debug") }}
            - debug
            {{- end }}
    {{- end }}
